global_defs {
    router_id PIHOLE1

    enable_script_security
    script_user root
}

# ============================================================
# Pi-hole Health Check
# ============================================================

vrrp_script chk_pihole {
    script "/usr/local/sbin/check-pihole.sh"

    interval 2
    timeout 3

    fall 3
    rise 2

    # Bei Fehler: Priorität 150 -> 0
    weight -200
}


# ============================================================
# IPv4 VRRP
# ============================================================

vrrp_instance PIHOLE_V4 {
    state MASTER

    interface eth0

    virtual_router_id 51

    priority 150

    advert_int 1

    authentication {
        auth_type PASS
        auth_pass PiHoleHA
    }

    virtual_ipaddress {
        10.5.5.2/24
    }

    track_script {
        chk_pihole
    }

    notify_master "/usr/local/sbin/keepalived-discord.sh PIHOLE_V4 MASTER"
    notify_backup "/usr/local/sbin/keepalived-discord.sh PIHOLE_V4 BACKUP"
}


# ============================================================
# IPv6 VRRP
# ============================================================

vrrp_instance PIHOLE_V6 {
    state MASTER

    interface eth0

    virtual_router_id 52

    priority 150

    advert_int 1

    virtual_ipaddress {
        fd00:5::2/64
    }

    track_script {
        chk_pihole
    }

    notify_master "/usr/local/sbin/keepalived-discord.sh vrrp PIHOLE_V6 MASTER"
    notify_backup "/usr/local/sbin/keepalived-discord.sh vrrp PIHOLE_V6 BACKUP"
}
