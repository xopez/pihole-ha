global_defs {
    router_id PIHOLE2

    enable_script_security
    script_user root
}

# ============================================================
# Pi-hole Health Check
# ============================================================

vrrp_script chk_pihole {
    script "/usr/local/sbin/check-pihole.sh"

    interval 5
    timeout 3

    fall 3
    rise 2

    # Bei Fehler: Priorität 100 -> 0
    weight -200
}

# ============================================================
# IPv4 VRRP
# ============================================================

vrrp_instance PIHOLE_V4 {
    state BACKUP

    interface enp3s0

    virtual_router_id 51

    priority 100

    advert_int 1

    virtual_ipaddress {
        10.5.5.2/24
    }

    track_script {
        chk_pihole
    }

    notify_master "/usr/local/sbin/keepalived-discord.sh MASTER"
    notify_backup "/usr/local/sbin/keepalived-discord.sh BACKUP"
}

# ============================================================
# IPv6 VRRP
# ============================================================

vrrp_instance PIHOLE_V6 {
    state BACKUP

    interface enp3s0

    virtual_router_id 52

    priority 100

    advert_int 1

    virtual_ipaddress {
        fd00:5::2/64
    }

    track_script {
        chk_pihole
    }
}
